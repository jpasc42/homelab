services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter

    restart: unless-stopped

    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:9100"

    volumes:
      - "/:/host:ro,rslave"

    networks:
      - web

networks:
  web:
    external: true
