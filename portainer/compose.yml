services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer

    restart: unless-stopped

    expose:
      - 9443

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      - web

networks:
  web:
    external: true


volumes:
  portainer_data:
    external: true
