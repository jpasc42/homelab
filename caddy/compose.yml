services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "80:80"
      - "443:443"
      - "100.119.88.87:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    external: true
